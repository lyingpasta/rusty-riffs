<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="160" height="160">
  <title>Rusty Riffs</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b202a"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9a8"/>
      <stop offset="0.45" stop-color="#c59a5f"/>
      <stop offset="1" stop-color="#8c6234"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6e6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#c59a5f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c59a5f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <path id="riff" d="M6 36 C8 36 8.5 32.5 10.5 32.5 C12.5 32.5 12.5 39.5 14.5 39.5 C16.5 39.5 16.5 29 19 29 C21.5 29 21.5 43 24 43 C26.5 43 27 36 30 36 C36 36 43 34 43 24.5 C43 17 33.5 17 33.5 24.5 C33.5 32 41 36 47 36 L58 36"
          fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <mask id="riff-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <use href="#riff" stroke="#fff"/>
    </mask>
  </defs>

  <style>
    .sheen {
      animation: sweep 6s ease-in-out 1s infinite backwards;
    }
    @keyframes sweep {
      from { transform: translateX(-24px) skewX(-20deg); }
      30%, to { transform: translateX(72px) skewX(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sheen { animation: none; }
    }
  </style>

  <rect width="64" height="64" rx="14" fill="url(#panel)"/>
  <rect width="64" height="64" rx="14" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <use href="#riff" stroke="#c59a5f" stroke-opacity="0.55" filter="url(#glow)"/>
  <use href="#riff" stroke="url(#bronze)"/>
  <g mask="url(#riff-mask)">
    <rect class="sheen" x="0" y="-8" width="14" height="80" fill="url(#sheen)" transform="translate(-24 0) skewX(-20)"/>
  </g>
</svg>
