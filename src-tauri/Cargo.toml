[package]
name = "rusty-riffs"
version = "0.1.0"
description = "A practice player for learning guitar parts by ear"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/lyingpasta/rusty-riffs"

[lib]
name = "rusty_riffs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
cpal = "0.18"
signalsmith-stretch = "0.1"
blake3 = { version = "1", features = ["mmap"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
